else if(a=='wl'){s.wq=Date.now()-s.start+600000;s.wp=0}
else if(a=='radd'){const i=$('#ri-'+v),n=i&&i.value.trim();if(!n)return;S.rn[v].push(['u'+Date.now(),n,''])}
else if(a=='rdel'){const[k,id]=v.split('|');S.rn[k]=S.rn[k].filter(z=>z[0]!=id)}
else if(a=='end'){if(m.on){S.mprev={prio:[...m.prio],len:m.len};if(m.wk>=m.len)S.cnt.meso++}m.on=false;m.prio=[];m.pick=[];m.tpl=-1;m.ov=0;applyMeso()}
else if(a=='mm'){m.mode=v;if(v=='clone'&&S.mprev){m.pick=[...S.mprev.prio];m.pl=S.mprev.len;m.ov=1}else m.ov=0}
else if(a=='tpl'){m.tpl=+v;m.pick=[...TPL[+v][1]]}
else if(a=='pick'){m.pick=m.pick.includes(v)?m.pick.filter(x=>x!=v):m.pick.length<3?[...m.pick,v]:m.pick}
else if(a=='len')m.pl=+v;
else if(a=='go'){Object.assign(m,{on:true,prio:[...m.pick],wk:1,len:m.pl,pick:[],tpl:-1,t0:today});applyMeso()}
save();render()});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='fn')frmCheck();if(t.dataset&&t.dataset.pj!=null){S.pj=t.value/100;const l=$('#pjl');if(l)l.textContent=Math.round(S.pj*100)+' %'}if(t.dataset&&t.dataset.bw!=null){S.bw=+t.value||0;save()}if(t.dataset&&t.dataset.rn){const[k,id]=t.dataset.rn.split('|'),it=S.rn[k].find(z=>z[0]==id);if(it){it[1]=t.value;save()}}if(t.dataset&&t.dataset.f&&S.ses.sets[t.dataset.e]){S.ses.sets[t.dataset.e][+t.dataset.i][t.dataset.f]=t.dataset.f=='rir'?+t.value:t.value;save()}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.bw!=null)render()});if(window.addEventListener){window.addEventListener('online',()=>{DB.flush();render()});window.addEventListener('offline',render)}
try{init3()}catch(err){}
setInterval(tick,1000);render();
